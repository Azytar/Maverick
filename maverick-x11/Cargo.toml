[package]
name = "maverick-x11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Maverick's X11 bootstrap: the Xlib display and the XCB connection the window manager uses"
categories = ["os::unix-apis"]
keywords = ["x11", "window-manager"]

[dependencies]
# `allow-unsafe-code` gates `xcb_ffi::XCBConnection`, the only way to adopt the
# `xcb_connection_t*` an Xlib `Display*` owns; its constructor is `unsafe`.
x11rb = { version = "0.13", default-features = false, features = ["allow-unsafe-code"] }

[dev-dependencies]
proptest.workspace = true
