[package]
name = "maverick-x11"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
authors = ["azytar"]
description = "Maverick's X11 bootstrap: the Xlib display and the XCB connection the window manager uses"
license = "GPL-3.0"
repository = "https://github.com/azytar/Maverick"
categories = ["os::unix-apis"]
keywords = ["x11", "window-manager"]

[dependencies]
# `allow-unsafe-code` is what makes `x11rb::xcb_ffi` available at all, and
# `x11rb::xcb_ffi::XCBConnection` is the only type there that can wrap a
# `xcb_connection_t*` this crate did not create — the one an Xlib `Display*`
# owns. Its constructor is `unsafe`, which is exactly why x11rb gates it.
x11rb = { version = "0.13", default-features = false, features = ["allow-unsafe-code"] }

[dev-dependencies]
# Property-based coverage for this crate's pure deterministic logic.
proptest.workspace = true
