[workspace]
members = ["maverick-sys", "maverick-dialog"]
resolver = "2"

[package]
name = "maverick"
version = "0.3.0"
edition = "2021"
authors = ["azytar"]
description = "maverick — columnar tiling WM with niri-style layout"
license = "GPL-3.0"

[[bin]]
name = "maverick"
path = "src/main.rs"

[dependencies]
maverick-sys = { path = "maverick-sys" }
libc = "0.2"
x11rb = { version = "0.13", default-features = false, features = ["randr"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
