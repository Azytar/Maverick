[workspace]
members = [
    "maverick-core",
    "maverick-sys",
    "maverick-x11",
    "maverick-toml",
    "maverick-img",
    "maverickctl",
]
# `maverick-vk` is an unwired Vulkan/X11 bootstrap. No crate depends on it, so
# it is unreachable from any build and its 3489 lines are never linked into the
# WM. It is excluded rather than deleted so the work is not thrown away, and so
# it stops appearing in workspace-wide `--workspace` test and clippy runs.
exclude = ["maverick-vk"]
resolver = "2"

# Centralised versions for shared dev-dependencies. Every entry here must be
# referenced by at least one `[dev-dependencies]` block below, otherwise cargo
# will not record it and the declaration is dead weight.
[workspace.dependencies]
# Property-based testing for the pure deterministic core: layout geometry,
# state transitions, configuration normalization and image decoding. A member
# crate opts in with `proptest.workspace = true` in its own manifest.
proptest = "1"
# Filesystem-isolated config loading tests. `UserConfig::load_from_path` reads a
# real file, so the reload/parse-fallback tests need a private directory rather
# than a hand-rolled name built from pid+nanos, which collides under parallel
# test execution and leaks the file when a test panics.
tempfile = "3"

[package]
name = "maverick"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
authors = ["azytar"]
description = "maverick — columnar tiling WM with niri-style layout"
license = "GPL-3.0"
repository = "https://github.com/azytar/Maverick"
categories = ["command-line-utilities", "gui"]
keywords = ["window-manager", "tiling", "x11"]

[[bin]]
name = "maverick"
path = "src/main.rs"

[dependencies]
maverick-core = { path = "maverick-core" }
maverick-sys = { path = "maverick-sys" }
maverick-toml = { path = "maverick-toml" }
maverick-img = { path = "maverick-img" }
libc = "0.2"
# The X11 connection bootstrap lives in `maverick-x11` and is the WM's only
# windowing-system dependency. There is no renderer backend: Maverick draws
# through X11 alone, so the WM needs nothing else to be correct.
maverick-x11 = { path = "maverick-x11" }
# `xkb` is used only to *subscribe* to keyboard-map changes (XkbMapNotify /
# XkbNewKeyboardNotify), which core `MappingNotify` does not always deliver —
# the keymap itself is still read with core `GetKeyboardMapping`.
# `allow-unsafe-code` is what makes `x11rb::xcb_ffi::XCBConnection` available so
# the bootstrap can hand back the one connection the WM uses.
x11rb = { version = "0.13", default-features = false, features = [
    "randr", "shape", "xkb", "allow-unsafe-code",
] }

[dev-dependencies]
proptest.workspace = true

[features]
# There is no `default` feature: the window manager has no optional subsystems.
# The features that remain are diagnostic builds with no runtime cost and no
# extra dependencies.
# Emits a structured "INPUT-TRACE" log on every input/focus decision so the
# fullscreen+pointer-loss root cause can be confirmed live in Xephyr. Enabled
# with `cargo build --features input-trace`.
input-trace = []
# Emits a structured "WINDOW-TRACE" log on every reconcile/focus boundary so
# the desired→applied→real→x11_focus pipeline can be confirmed live in Xephyr
# against a real client. Enabled with `cargo build --features window-trace`.
window-trace = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
