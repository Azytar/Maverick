[workspace]
members = [
    "maverick-core",
    "maverick-sys",
    "maverick-x11",
    "maverick-toml",
    "maverickctl",
]
resolver = "2"

[workspace.dependencies]
proptest = "1"
tempfile = "3"

[package]
name = "maverick"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["azytar"]
description = "maverick — columnar tiling WM with niri-style layout"
license = "GPL-3.0"
repository = "https://github.com/azytar/Maverick"
categories = ["command-line-utilities", "gui"]
keywords = ["window-manager", "tiling", "x11"]

[[bin]]
name = "maverick"
path = "src/main.rs"

[dependencies]
maverick-core = { path = "maverick-core" }
maverick-sys = { path = "maverick-sys" }
maverick-toml = { path = "maverick-toml" }
libc = "0.2"
maverick-x11 = { path = "maverick-x11" }
# `xkb` subscribes to keyboard-map changes core `MappingNotify` can miss.
# `allow-unsafe-code` is set in `maverick-x11`, the only crate that names
# `xcb_ffi`; cargo unifies the feature across the graph.
x11rb = { version = "0.13", default-features = false, features = [
    "randr", "shape", "xkb",
] }

[dev-dependencies]
proptest.workspace = true

[features]
# Both emit `[INPUT-TRACE]` / `[WINDOW-TRACE]` on stderr
# (`cargo build --features input-trace,window-trace`); neither is on by default.
input-trace = []
window-trace = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
