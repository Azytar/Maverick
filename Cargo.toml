[workspace]
members = [
    "maverick-core",
    "maverick-sys",
    "maverick-x11",
    "maverick-render",
    "maverick-gl",
    "maverick-toml",
    "maverick-img",
    "maverick-vk",
]
exclude = []
resolver = "2"

[package]
name = "maverick"
version = "0.7.0"
edition = "2021"
rust-version = "1.82"
authors = ["azytar"]
description = "maverick — columnar tiling WM with niri-style layout"
license = "GPL-3.0"
repository = "https://github.com/azytar/Maverick"
categories = ["command-line-utilities", "gui"]
keywords = ["window-manager", "tiling", "x11"]

[[bin]]
name = "maverick"
path = "src/main.rs"

[dependencies]
maverick-core = { path = "maverick-core" }
maverick-sys = { path = "maverick-sys" }
maverick-toml = { path = "maverick-toml" }
maverick-img = { path = "maverick-img" }
maverick-render = { path = "maverick-render" }
libc = "0.2"
# Core X11 connection bootstrap lives in `maverick-x11`, independent from any
# renderer backend. The WM always needs X11; the compositor does not.
maverick-x11 = { path = "maverick-x11" }
# `xkb` is used only to *subscribe* to keyboard-map changes (XkbMapNotify /
# XkbNewKeyboardNotify), which core `MappingNotify` does not always deliver —
# the keymap itself is still read with core `GetKeyboardMapping`.
# `allow-unsafe-code` is what makes `x11rb::xcb_ffi::XCBConnection` available so
# the WM and any renderer backend can share one connection.
# `composite`/`damage`/`xfixes` are gated behind `compositor-opengl` so a
# `--no-default-features` build does not pull compositor X extensions. Sync is
# a small, capability-checked X11 protocol feature used by the optional fence.
x11rb = { version = "0.13", default-features = false, features = [
    "randr", "shape", "sync", "xkb", "allow-unsafe-code",
] }
# OpenGL/GLX compositor backend. Optional: build with `--no-default-features`
# for a pure X11 WM, or `--features compositor-opengl` to enable it.
maverick-gl = { path = "maverick-gl", optional = true }

[features]
# Default build includes the OpenGL compositor backend.
default = ["compositor-opengl"]
# Diagnostic build: emits a structured "INPUT-TRACE" log on every input/focus
# decision so the fullscreen+pointer-loss root cause can be confirmed live in
# Xephyr. Off by default (no runtime cost, no extra deps). Enabled with
# `cargo build --features input-trace`.
input-trace = []
# Diagnostic build: emits a structured "WINDOW-TRACE" log on every
# reconcile/focus boundary so the desired→applied→real→x11_focus pipeline can be
# confirmed live in Xephyr against a real client. Off by
# default (no runtime cost, no extra deps). Enabled with
# `cargo build --features window-trace`.
window-trace = []
# OpenGL/GLX compositor backend.
compositor-opengl = ["dep:maverick-gl", "x11rb/composite", "x11rb/damage", "x11rb/xfixes"]
# Placeholder for a future Vulkan backend. Not yet wired.
compositor-vulkan = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
