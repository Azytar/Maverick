[workspace]
members = ["maverick-sys", "maverick-dialog"]
resolver = "2"

[package]
name = "maverick"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
authors = ["azytar"]
description = "maverick — columnar tiling WM with niri-style layout"
license = "GPL-3.0"
repository = "https://github.com/azytar/Maverick"
categories = ["command-line-utilities", "gui"]
keywords = ["window-manager", "tiling", "x11", "wayland"]

[[bin]]
name = "maverick"
path = "src/main.rs"

[features]
# The internal status bar is optional. Build with it (default):
#   cargo build --release
# Build without it (rely on Waybar/Polybar or no bar at all):
#   cargo build --release --no-default-features
default = ["internal-bar"]
internal-bar = []

[dependencies]
maverick-sys = { path = "maverick-sys" }
libc = "0.2"
x11rb = { version = "0.13", default-features = false, features = ["randr"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
