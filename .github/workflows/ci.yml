name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The WM and its runtime libraries live in the workspace. Lint + test them
  # together so the dev loop is covered.
  wm:
    name: WM workspace (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # install.sh is plain bash — check its syntax so it cannot silently bitrot.
  install-script:
    name: install.sh (bash syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n install.sh
      - name: Installer smoke test
        run: python3 tests/install-smoke.py

  x11-smoke:
    name: X11 smoke (no compositor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install isolated Xvfb test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils libx11-dev libxcb1-dev
      - name: Build supported profile
        run: cargo build --release --no-default-features -p maverick -p maverick-sys
      - name: Xvfb stacking regression
        run: python3 tests/xvfb-stacking.py
