name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The WM and its runtime libraries live in the workspace. Lint + test them
  # together so the dev loop is covered.
  wm:
    name: WM workspace (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install X11 development libraries
        # `cargo test --workspace --all-targets` links the root package's unit
        # tests and maverick-x11's integration tests, so this job needs the same
        # link interface as the release build rather than whatever the runner
        # image happens to carry. `maverick` links `libX11` and `libX11-xcb`
        # (see the `#[link]` attributes in maverick-x11), and Ubuntu ships the
        # second in `libx11-xcb-dev`, which `libx11-dev` does not depend on.
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxcb1-dev
      - name: Format
        # Documented in README.md ("Building from source") and
        # docs/architecture.md ("Checking these claims") but never run here.
        # No `--locked`: cargo fmt resolves no dependency graph, and rejects
        # the flag outright, so it cannot detect a stale lock.
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        # `--all-targets` matches the `cargo check --workspace --all-targets`
        # gate in docs/architecture.md: a target Clippy compiles is a target
        # whose tests should run.
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Test (default features)
        # The only features left are the two diagnostic trace builds, so this
        # is what catches a trace-only build breaking. It is the configuration
        # the release binary ships.
        run: cargo test --workspace --all-targets --locked

  # The installer is plain bash — check its syntax so it cannot silently bitrot.
  # `installer/tests/partition.py` runs every smoke suite from
  # `tests/install-smoke.py` plus the partition-only ones, so it is the whole
  # installer check; the smoke module stays runnable on its own.
  install-script:
    name: installer (bash syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n installer/install.sh installer/lib/*.sh
      - name: Installer test suite
        run: python3 installer/tests/partition.py

  x11-smoke:
    name: X11 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X11 test and development dependencies
        # `tests/xvfb-stacking.py` drives the window manager through `xdotool`,
        # which is its own Debian package rather than a member of x11-utils.
        # The three `-dev` packages are the same link interface the `wm` job
        # needs: the build below links `libX11` and `libX11-xcb`, and Ubuntu
        # provides the second through `libx11-xcb-dev`, which `libx11-dev` does
        # not depend on.
        #
        # One package per argument, on a single uncontinued line. This `run`
        # value used to be an unquoted YAML plain scalar spanning two source
        # lines, and YAML folds such a break into a space; the trailing
        # backslash then escaped that space rather than continuing the command,
        # so apt received a single argument, " xvfb", and refused the install
        # before anything was compiled.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool picom libxcomposite-dev libxfixes-dev libxi-dev libxtst-dev libx11-dev libx11-xcb-dev libxcb1-dev
      - name: Build release profile
        # `tests/xvfb-stacking.py` drives target/release/maverick, so build
        # that profile: it is the one `installer/install.sh` produces and
        # installs. A debug build is not the artifact that ships, and the gate
        # must not pass against it instead.
        # There is no `default` feature and no compositor to leave out, so this
        # is one command with no feature flags — not "the only build there is".
        run: cargo build --release -p maverick -p maverickctl --locked
      - name: Xvfb stacking regression
        run: python3 tests/xvfb-stacking.py
      - name: Shell harness isolation
        run: python3 tests/harness-isolation.py
      - name: Session teardown liveness
        run: |
          python3 tests/session-teardown.py
          python3 tests/session-teardown.py --exec-client
          python3 tests/session-teardown.py --stale-group
      - name: Live configuration reload
        run: python3 tests/xvfb-reload.py
      - name: Explicit layout restoration
        run: python3 tests/xvfb-restore.py
      - name: Floating focus and transient stacking
        run: |
          python3 tests/xvfb-floats.py --case focus
          python3 tests/xvfb-floats.py --case transients
          python3 tests/xvfb-floats.py --case metadata
          python3 tests/xvfb-floats.py --case vertical
      - name: Layout preservation across restart
        run: |
          python3 tests/xvfb-restart.py
          python3 tests/xvfb-restart.py --pointer-focus
      - name: Root cursor startup and ownership
        run: |
          python3 tests/xvfb-cursor.py
          python3 tests/xvfb-cursor-theme.py
      - name: X11 focus and input regressions
        run: |
          python3 tests/xvfb-input.py --case protocol
          python3 tests/xvfb-input.py --case ownership
          python3 tests/xvfb-input.py --case child
          python3 tests/xvfb-input.py --case capture
          python3 tests/xvfb-input.py --case capture --exclusive
          python3 tests/xvfb-wine-focus.py --wm target/release/maverick
      - name: Fullscreen lifecycle and idle event queue regression
        run: |
          python3 tests/xvfb-wine-focus.py --wm target/release/maverick --probe tests/fullscreen-lifecycle-probe.c --complete fullscreen-lifecycle
          AUDIT_PUBLICATION_ROUNDS=128 python3 tests/xvfb-wine-focus.py --wm target/release/maverick --probe tests/fullscreen-lifecycle-probe.c --complete fullscreen-lifecycle --honor-initial-state
      - name: Overview rig isolation
        run: python3 tests/overview-isolation.py
      - name: Overview client geometry and image regression
        run: |
          python3 tests/xvfb-overview.py
          python3 tests/xvfb-overview.py --compositor
          python3 tests/xvfb-overview.py --without-composite
