# Maverick — customizable starting configuration
# Copy to ~/.config/maverick/config.toml or use --config <path>.
# This file keeps the same behavior as running without a configuration file:
# square corners, no borders, no application rules and no autostart programs.
# Commented settings show their defaults unless an alternative is described.
# Validate edits with: maverick --check-config ~/.config/maverick/config.toml
#
# Ordinary values override only the fields you set. A [[keybindings]] entry
# replaces the default keymap: uncomment the whole keybinding section before
# editing it if you want to retain the other shortcuts. [[rules]] replaces the
# rule list, which is empty by default. [autostart].commands replaces its list.

[general]
border_width = 0
corner_radius = 0

# Space between tiles and between the layout and screen edges, in pixels.
# gaps_inner = 4
# gaps_outer = 8
# smart_gaps = false

# New-column width as a fraction of the workarea (0.1–1.0).
# column_width = 0.6
# accordion_boost = 0.0

# Views per monitor, their labels and automatic numeric bindings.
# Super+1..9 selects a View; Super+Shift+1..9 moves the focused window.
# n_tags = 9
# tag_names = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
# auto_workspace_binds = true

# Pointer focus and automatic cursor warping are opt-in.
# focus_mouse = false
# warp_cursor = false

# New windows open as normal tiles. Runtime fullscreen (F11) still works.
# honor_initial_state = false

# Overview scales window images while retaining client geometry.
# Set both values to 1.0 for an Overview without image reduction.
# overview_scale = 0.76
# overview_zoom_min = 0.25

# Border colors are invisible while border_width = 0. To enable borders,
# set a positive width and optionally uncomment the colors below.
# [colors]
# normal = 0x45475a
# focused = 0x89b4fa
# urgent = 0xf38ba8

# Keybindings — these are the compiled defaults, shown for customization.
# Keep the section commented to inherit them unchanged.
# Modifiers: Super/Mod4, Shift, Control/Ctrl, Alt/Mod1.
# Keys: letters, digits, F1..F12, Return, Space, Tab, equal, minus,
# bracketleft/right and XF86 names. Raw keysyms use 0x<hex>.
# The terminal and launcher commands run only when their shortcuts are used;
# replace alacritty/rofi with the programs installed on your machine.

# [[keybindings]]
# key = "Mod4+Return"
# action = "spawn:alacritty"

# [[keybindings]]
# key = "Mod4+Shift+p"
# action = "spawn:rofi -show run"

# [[keybindings]]
# key = "Mod4+p"
# action = "spawn:rofi -show drun"

# [[keybindings]]
# key = "Mod4+Shift+c"
# action = "kill"

# [[keybindings]]
# key = "Mod4+Shift+space"
# action = "toggle_float"

# [[keybindings]]
# key = "Mod4+Shift+f"
# action = "toggle_fullscreen"

# [[keybindings]]
# key = "Mod4+Shift+m"
# action = "toggle_maximize"

# Focus / move within the ribbon (vim-style)
# [[keybindings]]
# key = "Mod4+h"
# action = "focus:left"
# [[keybindings]]
# key = "Mod4+l"
# action = "focus:right"
# [[keybindings]]
# key = "Mod4+j"
# action = "focus:down"
# [[keybindings]]
# key = "Mod4+k"
# action = "focus:up"
# [[keybindings]]
# key = "Mod4+Shift+h"
# action = "move:left"
# [[keybindings]]
# key = "Mod4+Shift+l"
# action = "move:right"
# [[keybindings]]
# key = "Mod4+Shift+j"
# action = "move:down"
# [[keybindings]]
# key = "Mod4+Shift+k"
# action = "move:up"

# Column operations
# [[keybindings]]
# key = "Mod4+Shift+Return"
# action = "new_column"
# [[keybindings]]
# key = "Mod4+Control+h"
# action = "grow_col:-50"
# [[keybindings]]
# key = "Mod4+Control+l"
# action = "grow_col:50"
# [[keybindings]]
# key = "Mod4+Control+j"
# action = "collapse_column"

# Layout — Column is the only layout there is to select.
# [[keybindings]]
# key = "Mod4+t"
# action = "layout:column"

# Session — `quit` is the WM's own clean shutdown: no confirmation dialog and
# no auxiliary process on the quit path.
# [[keybindings]]
# key = "Mod4+Shift+q"
# action = "quit"
# [[keybindings]]
# key = "Mod4+Shift+r"
# action = "restart"
# [[keybindings]]
# key = "Mod4+F5"
# action = "restart"

# Monitor navigation
# [[keybindings]]
# key = "Mod4+Tab"
# action = "focus_mon:next"
# [[keybindings]]
# key = "Mod4+Shift+Tab"
# action = "move_mon:next"

# Overview (fixed-scale navigation viewport)
# [[keybindings]]
# key = "Mod4+o"
# action = "toggle_overview"
# [[keybindings]]
# key = "Mod4+n"
# action = "overview_nav:right"
# [[keybindings]]
# key = "Mod4+Shift+o"
# action = "overview_nav:left"
# [[keybindings]]
# key = "Mod4+e"
# action = "overview_enter"

# Viewport zoom and page navigation
# [[keybindings]]
# key = "Mod4+equal"
# action = "viewport_zoom:0.2"     # enlarge the ribbon
# [[keybindings]]
# key = "Mod4+minus"
# action = "viewport_zoom:-0.2"    # shrink it again, back toward Normal
# [[keybindings]]
# key = "Mod4+bracketright"
# action = "page_snap:right"       # scroll the camera one screen-width right
# [[keybindings]]
# key = "Mod4+bracketleft"
# action = "page_snap:left"         # …and left

# Rules — no rule is active or inherited by default.
# Match class, instance or title by case-insensitive substring; window_type
# matches a complete type name. Multiple criteria in a rule must all match.
# Dialogs and transients still float when their X11 properties request it.
# Replace "my-app" with a class you chose before enabling an example.
# [[rules]]
# class = "my-app"
# float = true
# size = [480, 360]
# position = [120, 100]

# Optional per-application placement or fullscreen policy:
# [[rules]]
# class = "my-game"
# workspace = 2
# true_fullscreen = true

# Autostart — nothing is launched unless you add an entry.
# Each entry is a program and separate arguments, not a shell command.
[autostart]
commands = [
  # Optional GTK file chooser portals, using Arch Linux paths.
  # Debian/Ubuntu normally use /usr/libexec instead of /usr/lib.
  # See README.md "Optional file chooser portals" for prerequisites and checks.
  # ["/usr/lib/xdg-desktop-portal-gtk"],
  # ["/usr/lib/xdg-desktop-portal"],
  # ["polybar", "main"],
  # ["picom"],
  # ["feh", "--bg-fill", "/path/to/wallpaper.png"],
]
