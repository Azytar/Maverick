[package]
name = "maverick-sys"
version = "0.7.0"
edition = "2021"
rust-version = "1.82"
authors = ["azytar"]
description = "Maverick's OS/control boundary: libc FFI (signals, poll, uid/gid, process-tree signalling), instance identity and discovery, the Unix-socket control protocol, the Maverick Session model, and the shared maverickctl/maverick-msg CLI engine"
license = "GPL-3.0"
repository = "https://github.com/azytar/Maverick"
categories = ["os::unix-apis"]
keywords = ["window-manager", "ipc", "ffi"]

[dependencies]
libc = "0.2"

# `maverick-msg` is an explicit bin so both control tools build from the
# shared CLI engine (`maverick-sys::ctl`); `maverickctl` is auto-discovered
# from src/bin/.
[[bin]]
name = "maverick-msg"
path = "src/bin/maverick-msg.rs"

[dev-dependencies]
# Property-based coverage for this crate's pure deterministic logic.
proptest.workspace = true
# The session tests write real `.Xauthority` files and records into a
# throwaway directory, so they need a private one that cleans itself up rather
# than a hand-rolled name that collides under parallel execution.
tempfile.workspace = true
