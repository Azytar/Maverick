[package]
name = "maverick-sys"
version = "0.7.1"
edition = "2021"
rust-version = "1.82"
authors = ["azytar"]
description = "Maverick's OS/control boundary: libc FFI (signals, poll, uid/gid, process-tree signalling), instance identity and discovery, the Unix-socket control protocol, the Maverick Session model, and the maverickctl CLI engine"
license = "GPL-3.0"
repository = "https://github.com/azytar/Maverick"
categories = ["os::unix-apis"]
keywords = ["window-manager", "ipc", "ffi"]

[dependencies]
libc = "0.2"
# Process, descriptor and entropy operations go through a maintained syscall
# layer rather than hand-written FFI in this crate, so the `sigaction` and
# `sigemptyset` details and the `pollfd` layout are not ours to get right.
#
# This adds no package: `x11rb` already depends on rustix, and the lockfile
# already pins it. Only the `event`, `fs` and `rand` features are new, and
# `default-features = false` keeps the `pty`/`mm`/`mount`/`shm` surface out of
# a crate whose only consumer is a window manager.
rustix = { version = "1", default-features = false, features = [
    "std",
    "event",
    "fs",
    "rand",
] }

[dev-dependencies]
# Property-based coverage for this crate's pure deterministic logic.
proptest.workspace = true
# The session tests write real `.Xauthority` files and records into a
# throwaway directory, so they need a private one that cleans itself up rather
# than a hand-rolled name that collides under parallel execution.
tempfile.workspace = true
