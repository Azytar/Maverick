[package]
name = "maverickctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "maverickctl — external Unix control tool for the Maverick window manager: CLI parsing, control-socket IPC client, and session/discovery operations. It drives a running Maverick over the control socket and never links the window manager itself."
categories = ["command-line-utilities"]
keywords = ["linux", "unix", "window-manager", "ipc", "cli"]

[dependencies]
maverick-sys.workspace = true
libc = "0.2"
rustix = { version = "1", default-features = false, features = [
    "std",
    "fs",
    "process",
    "rand",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
