[workspace]
members = ["control"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "1.1.1"
edition = "2021"
rust-version = "1.85"
authors = ["Azytar <stardust_ech0@proton.me>"]
license = "GPL-3.0"
repository = "https://github.com/Azytar/maverickctl"

[workspace.dependencies]
proptest = "1"
tempfile = "3"

[package]
name = "maverickctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent Unix control client and session manager for Maverick"

[dependencies]
maverick-protocol = { path = "control", version = "1.1.1" }
libc = "0.2"
rustix = { version = "1", default-features = false, features = ["std", "fs", "process", "rand"] }

[dev-dependencies]
maverick-protocol = { path = "control", features = ["test-server"] }
proptest.workspace = true
tempfile.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
