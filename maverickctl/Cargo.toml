[package]
name = "maverickctl"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
authors = ["azytar"]
description = "maverickctl — external Unix control tool for the Maverick window manager: CLI parsing, control-socket IPC client, and session/discovery operations. It drives a running Maverick over the control socket and never links the window manager itself."
license = "GPL-3.0"
repository = "https://github.com/azytar/Maverick"
categories = ["command-line-utilities"]
keywords = ["window-manager", "ipc", "cli"]

[dependencies]
# The only Maverick crate this tool links: the shared control-protocol surface
# (socket paths, peer-credential authorization, line framing, JSON helpers).
# Session orchestration, discovery and the IPC client live in this crate.
maverick-sys = { path = "../maverick-sys" }
# Same revisions as the workspace lockfile already pins for maverick-sys: no
# new dependency, the tool just declares what its moved code already used.
libc = "0.2"
rustix = { version = "1", default-features = false, features = [
    "std",
    "fs",
    "process",
    "rand",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
